# The Windows installer, built on a GitHub runner, with the engine (engine/, Rust) it runs.
#
#   git tag v0.2.0-offline.1 && git push origin v0.2.0-offline.1
#       builds, and attaches the installer and its SHA-256 to a release named after the tag
#   Actions → Build → Run workflow
#       builds only: the installer is kept as the run's artifact
name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Engine tests
        working-directory: engine
        run: cargo test --locked

      - name: App dependencies
        working-directory: app
        run: npm ci

      # build/ is not in the repo: the icon is drawn by a script.
      - name: Icon
        working-directory: app
        run: npm run icon

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Installer
        working-directory: app
        run: npm run dist
        # The read-only token the app reads its private releases with (Settings → Secrets → UPDATE_TOKEN).
        env:
          NAYEL_UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}

      - name: Checksum
        id: sum
        working-directory: app/dist
        run: |
          $exe = Get-ChildItem Nayel-Overlay-Setup-*.exe | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding ascii "$($exe.Name).sha256"
          "exe=$($exe.Name)" >> $env:GITHUB_OUTPUT
          "hash=$hash" >> $env:GITHUB_OUTPUT
          $zip = Get-ChildItem Nayel-Overlay-*-portable.zip | Select-Object -First 1
          $zipHash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          "$zipHash  $($zip.Name)" | Out-File -Encoding ascii "$($zip.Name).sha256"
          "zip=$($zip.Name)" >> $env:GITHUB_OUTPUT
          "ziphash=$zipHash" >> $env:GITHUB_OUTPUT
          # The installer again, zipped: for browsers and chats that block a bare .exe.
          $version = $exe.BaseName -replace '^Nayel-Overlay-Setup-', ''
          $inst = "Nayel-Overlay-$version-installer.zip"
          Compress-Archive -Path $exe.FullName -DestinationPath $inst
          # And under a name without the version, so .../releases/latest/download/Nayel-Overlay-installer.zip
          # is always the newest (the Lokthar site links to it).
          Copy-Item $inst Nayel-Overlay-installer.zip
          $instHash = (Get-FileHash $inst -Algorithm SHA256).Hash.ToLower()
          "$instHash  $inst" | Out-File -Encoding ascii "$inst.sha256"
          "inst=$inst" >> $env:GITHUB_OUTPUT
          "insthash=$instHash" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: |
            app/dist/${{ steps.sum.outputs.exe }}
            app/dist/${{ steps.sum.outputs.exe }}.sha256
            app/dist/${{ steps.sum.outputs.exe }}.blockmap
            app/dist/latest.yml
            app/dist/${{ steps.sum.outputs.zip }}
            app/dist/${{ steps.sum.outputs.zip }}.sha256
            app/dist/${{ steps.sum.outputs.inst }}
            app/dist/${{ steps.sum.outputs.inst }}.sha256
            app/dist/Nayel-Overlay-installer.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: app/dist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXE: ${{ steps.sum.outputs.exe }}
          HASH: ${{ steps.sum.outputs.hash }}
          ZIP: ${{ steps.sum.outputs.zip }}
          ZIPHASH: ${{ steps.sum.outputs.ziphash }}
          INST: ${{ steps.sum.outputs.inst }}
          INSTHASH: ${{ steps.sum.outputs.insthash }}
        run: |
          # latest.yml (and the blockmap) are what the app's updater reads: Settings → Updates.
          gh release create "$GITHUB_REF_NAME" "$EXE" "$EXE.sha256" "$EXE.blockmap" latest.yml "$ZIP" "$ZIP.sha256" "$INST" "$INST.sha256" Nayel-Overlay-installer.zip \
            --title "Nayel Overlay $GITHUB_REF_NAME" \
            --notes "Nayel Overlay (Lokthar fork) from commit $GITHUB_SHA. No shared timers, no machine id. It goes online only for the optional Lokthar field boss sync (off by default), the market prices, and when you check for updates (Settings → Updates).

          Needs [Npcap](https://npcap.com) installed first.

          **Windows warning:** the app is not code-signed, so Windows warns about a downloaded copy the first time (\"Windows protected your PC\"). Click **More info**, then **Run anyway**. For the zips: before unpacking, right-click the zip → Properties → tick **Unblock** → OK, and Windows asks nothing for the files in it. Updates from the app's menu are not downloaded by a browser and are not warned about.

          **Installer in a zip:** \`$INST\` holds the same \`$EXE\`, for browsers or chats that block downloading an .exe.

          **Portable:** \`$ZIP\` is the same app without an installer: unpack it anywhere and run \`Nayel-Overlay.exe\`. To update it, use Settings → Updates, or unpack a newer zip over the folder (your settings and data are kept in %APPDATA%\\Nayel Overlay).

          ---

          **En français**

          Il faut d'abord installer [Npcap](https://npcap.com).

          **Avertissement de Windows :** l'app n'est pas signée, donc Windows prévient la première fois qu'on lance une copie téléchargée (« Windows a protégé votre ordinateur »). Clique sur **Informations complémentaires**, puis **Exécuter quand même**. Pour les zips : avant de décompresser, clic droit sur le zip → Propriétés → coche **Débloquer** → OK, et Windows ne demande plus rien pour les fichiers qu'il contient. Les mises à jour faites depuis le menu de l'app ne passent pas par un navigateur et ne déclenchent pas d'avertissement.

          **Installeur dans un zip :** \`$INST\` contient le même \`$EXE\`, pour les navigateurs ou messageries qui bloquent le téléchargement d'un .exe.

          **Portable :** \`$ZIP\` est la même app sans installeur : décompresse-la où tu veux et lance \`Nayel-Overlay.exe\`. Pour la mettre à jour, passe par Réglages → Mises à jour, ou décompresse un zip plus récent par-dessus le dossier (tes réglages et données restent dans %APPDATA%\\Nayel Overlay).

          ---

          SHA-256 of \`$EXE\`: \`$HASH\`
          SHA-256 of \`$ZIP\`: \`$ZIPHASH\`
          SHA-256 of \`$INST\`: \`$INSTHASH\`"
